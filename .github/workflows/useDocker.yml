name: Use docker inside steps/jobs

on: 
  workflow_dispatch:

jobs:
  hybrid-job:
    runs-on: ubuntu-latest
    steps:
      - name: Running a command inside Ubuntu
        run: echo "This is running inside Ubuntu"

      - name: Running a command inside docker image
        uses: docker://alpine:3.14 # The image must be accessible without authentication
        with:
          entrypoint: /bin/sh
          args: |
            -c "echo 'This command is running inside an Apline container'"

      - name: Running anthor command inside Ubuntu
        run: echo "Back to Ubuntu"

  dockerized-job:
    runs-on: ubuntu-latest
    container:
      image: Node:20
      # image: ghcr.io/my-org/my-private-image:latest
      # credentials:
        # username: ${{ secrets.DOCKER_USERNAME }}
        # password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - run: node --version
      - run: echo "This whole job runs inside a Node.js container"















